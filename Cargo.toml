[package]
name = "faust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Live Markdown preview for Obsidian vaults, with a TUI soul and a GPU body."
license = "MIT"
repository = "https://github.com/nak/faust"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
] }
egui = { version = "0.36", default-features = false }
ignore = "0.4"
notify = { version = "8", default-features = false }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
